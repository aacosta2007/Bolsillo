<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Bolsillo · Presupuestos</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0F5E55;text-decoration:none}a:hover{color:#0B4740}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F4F6F3; color: #16201B; font-family: Figtree, system-ui, sans-serif; display: flex; flex-direction: column">

  <div style="flex: 1; overflow-y: auto; padding: 20px 20px 24px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 26px">Presupuestos</h1>
      <button aria-label="Nuevo presupuesto" style="width: 44px; height: 44px; border-radius: 14px; border: 0; background: #0F5E55; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
    </div>

    <div style="display: flex; align-items: center; justify-content: space-between; background: #FFFFFF; border-radius: 14px; padding: 4px">
      <button aria-label="Mes anterior" style="width: 44px; height: 44px; border: 0; background: transparent; color: #16201B; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
      <span style="font-weight: 700; font-size: 15px">Octubre 2026</span>
      <button aria-label="Mes siguiente" style="width: 44px; height: 44px; border: 0; background: transparent; color: #16201B; border-radius: 10px; cursor: pointer; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
    </div>

    <div style="background: #16201B; color: #FFFFFF; border-radius: 22px; padding: 18px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <span style="font-size: 13px; color: #C4CEC8">Gastado del total presupuestado</span>
        <span style="font-size: 13px; color: #C4CEC8">13 días restantes</span>
      </div>
      <div style="display: flex; align-items: baseline; gap: 8px">
        <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 30px; font-variant-numeric: tabular-nums">$ 1.784.300</span>
        <span style="font-size: 14px; color: #C4CEC8">de $ 2.600.000</span>
      </div>
      <div style="height: 10px; border-radius: 999px; background: #34403A; overflow: hidden"><div style="width: 69%; height: 100%; border-radius: 999px; background: #7DD3C0"></div></div>
      <span style="font-size: 13px; color: #C4CEC8">Puedes gastar ≈ $ 62.800 por día y cerrar el mes en verde.</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <sc-for list="{{budgets}}" as="b" hint-placeholder-count="5">
        <div style="background: #FFFFFF; border-radius: 18px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
          <div style="display: flex; align-items: center; gap: 10px">
            <span style="width: 34px; height: 34px; border-radius: 10px; background: {{b.color}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px">{{b.initial}}</span>
            <div style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 600; font-size: 15px">{{b.name}}</span><span style="font-size: 12px; color: #55615B; font-variant-numeric: tabular-nums">{{b.detail}}</span></div>
            <span style="font-size: 12px; font-weight: 700; padding: 4px 8px; border-radius: 999px; background: {{b.chipBg}}; color: {{b.chipFg}}">{{b.chip}}</span>
          </div>
          <div style="height: 8px; border-radius: 999px; background: #EEF1EE; overflow: hidden"><div style="width: {{b.width}}; height: 100%; border-radius: 999px; background: {{b.bar}}"></div></div>
          <span style="font-size: 12px; color: {{b.noteColor}}; font-variant-numeric: tabular-nums">{{b.note}}</span>
        </div>
      </sc-for>
    </div>

    <button style="height: 48px; border-radius: 14px; border: 1px dashed #A9B5AE; background: transparent; color: #0F5E55; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Copiar presupuestos de septiembre</button>
  </div>

  <nav aria-label="Navegación principal" style="height: 84px; flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #E2E7E3; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; padding: 0 8px 12px">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; color: #55615B; min-height: 44px; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Inicio</a>
    <a href="Movimientos.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; color: #55615B; min-height: 44px; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg>Movimientos</a>
    <a href="Agregar.dc.html" aria-label="Agregar movimiento" style="justify-self: center; width: 56px; height: 56px; border-radius: 18px; background: #0F5E55; color: #FFFFFF; display: flex; align-items: center; justify-content: center; margin-top: -18px; box-shadow: 0 8px 20px rgba(15,94,85,0.35)">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
    <a href="Presupuestos.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: #0F5E55; min-height: 44px; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12A9 9 0 1 1 12 3v9z"></path><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"></path></svg>Presupuestos</a>
    <a href="Metas.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; color: #55615B; min-height: 44px; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="5"></circle><circle cx="12" cy="12" r="1"></circle></svg>Metas</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"warnAt":{"editor":"range","default":80,"min":50,"max":95,"step":5,"unit":"%"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const warnAt = this.props.warnAt ?? 80;
    const f = (n) => '$ ' + n.toLocaleString('es-CO');
    const rows = [['Comida', '#0F5E55', 510000, 600000], ['Hogar', '#C2410C', 1200000, 1200000], ['Transporte', '#2563EB', 145000, 250000], ['Entretenimiento', '#6D28D9', 212000, 180000], ['Servicios', '#B7791F', 98300, 370000]];
    const budgets = rows.map(([name, color, spent, limit]) => {
      const pct = Math.round(spent / limit * 100);
      const exceeded = spent > limit;
      const warning = !exceeded && pct >= warnAt;
      const left = limit - spent;
      return {
        name, color, initial: name.charAt(0),
        detail: f(spent) + ' de ' + f(limit),
        width: Math.min(pct, 100) + '%',
        bar: exceeded ? '#B33A0A' : warning ? '#E58A2E' : '#0F5E55',
        chip: pct + ' %',
        chipBg: exceeded ? '#FDE3D6' : warning ? '#FFF0DC' : '#E3F0ED',
        chipFg: exceeded ? '#8A2C07' : warning ? '#8A4A0F' : '#0B4740',
        note: exceeded ? 'Te pasaste por ' + f(-left) : left === 0 ? 'Presupuesto completo' : 'Disponible ' + f(left),
        noteColor: exceeded ? '#B33A0A' : '#55615B'
      };
    });
    return { budgets };
  }
}
</script>
</body>
</html>
