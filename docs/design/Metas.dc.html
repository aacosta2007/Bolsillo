<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Bolsillo · Metas y recurrentes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0F5E55;text-decoration:none}a:hover{color:#0B4740}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F4F6F3; color: #16201B; font-family: Figtree, system-ui, sans-serif; display: flex; flex-direction: column">

  <div style="flex: 1; overflow-y: auto; padding: 20px 20px 24px; display: flex; flex-direction: column; gap: 16px">
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 26px">Metas</h1>

    <div role="tablist" aria-label="Secciones" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #E7EBE7; border-radius: 14px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
        <button role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="height: 40px; border: 0; border-radius: 10px; background: {{t.bg}}; color: {{t.fg}}; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">{{t.label}}</button>
      </sc-for>
    </div>

    <sc-if value="{{showGoals}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 12px">
        <sc-for list="{{goals}}" as="g" hint-placeholder-count="3">
          <div style="background: #FFFFFF; border-radius: 20px; padding: 16px; display: flex; gap: 14px; align-items: center">
            <svg width="64" height="64" viewBox="0 0 36 36" role="img" aria-label="{{g.aria}}" style="flex-shrink: 0">
              <circle cx="18" cy="18" r="15" fill="none" stroke="#EEF1EE" stroke-width="4"></circle>
              <circle cx="18" cy="18" r="15" fill="none" stroke="{{g.color}}" stroke-width="4" stroke-linecap="round" stroke-dasharray="{{g.dash}}" transform="rotate(-90 18 18)"></circle>
              <text x="18" y="21" text-anchor="middle" font-size="8.5" font-weight="700" fill="#16201B" font-family="Figtree, sans-serif">{{g.pct}}</text>
            </svg>
            <div style="flex: 1; display: flex; flex-direction: column; gap: 3px; min-width: 0">
              <span style="font-weight: 700; font-size: 15px">{{g.name}}</span>
              <span style="font-size: 13px; color: #3D4843; font-variant-numeric: tabular-nums">{{g.progress}}</span>
              <span style="font-size: 12px; color: #55615B">{{g.hint}}</span>
            </div>
            <button aria-label="{{g.addLabel}}" style="width: 44px; height: 44px; border-radius: 14px; border: 1px solid #DDE3DE; background: #FFFFFF; color: #0F5E55; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
          </div>
        </sc-for>
        <button style="height: 50px; border-radius: 14px; border: 0; background: #0F5E55; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer">Nueva meta de ahorro</button>
      </div>
    </sc-if>

    <sc-if value="{{showRecurring}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 12px">
        <div style="background: #FFFFFF; border-radius: 18px; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center">
          <div style="display: flex; flex-direction: column"><span style="font-size: 12px; color: #55615B">Fijos al mes</span><span style="font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums">$ 1.426.800</span></div>
          <div style="display: flex; flex-direction: column; align-items: flex-end"><span style="font-size: 12px; color: #55615B">Próximo cobro</span><span style="font-weight: 600; font-size: 14px">Netflix · 20 oct</span></div>
        </div>
        <div style="background: #FFFFFF; border-radius: 18px; padding: 4px 16px">
          <sc-for list="{{rules}}" as="r" hint-placeholder-count="4">
            <div style="display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid {{r.sep}}">
              <span style="width: 40px; height: 40px; border-radius: 12px; background: {{r.tint}}; color: {{r.ink}}; display: flex; align-items: center; justify-content: center">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 2l4 4-4 4"></path><path d="M3 11V9a3 3 0 0 1 3-3h15"></path><path d="M7 22l-4-4 4-4"></path><path d="M21 13v2a3 3 0 0 1-3 3H3"></path></svg></span>
              <div style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 600; font-size: 14px">{{r.name}}</span><span style="font-size: 12px; color: #55615B">{{r.meta}}</span></div>
              <span style="font-weight: 700; font-size: 14px; color: {{r.color}}; font-variant-numeric: tabular-nums">{{r.amount}}</span>
            </div>
          </sc-for>
        </div>
        <button style="height: 50px; border-radius: 14px; border: 0; background: #0F5E55; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer">Nuevo recurrente</button>
      </div>
    </sc-if>
  </div>

  <nav aria-label="Navegación principal" style="height: 84px; flex-shrink: 0; background: #FFFFFF; border-top: 1px solid #E2E7E3; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; padding: 0 8px 12px">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; color: #55615B; min-height: 44px; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Inicio</a>
    <a href="Movimientos.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; color: #55615B; min-height: 44px; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"></path></svg>Movimientos</a>
    <a href="Agregar.dc.html" aria-label="Agregar movimiento" style="justify-self: center; width: 56px; height: 56px; border-radius: 18px; background: #0F5E55; color: #FFFFFF; display: flex; align-items: center; justify-content: center; margin-top: -18px; box-shadow: 0 8px 20px rgba(15,94,85,0.35)">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
    <a href="Presupuestos.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; color: #55615B; min-height: 44px; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12A9 9 0 1 1 12 3v9z"></path><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"></path></svg>Presupuestos</a>
    <a href="Metas.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: #0F5E55; min-height: 44px; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="5"></circle><circle cx="12" cy="12" r="1"></circle></svg>Metas</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'goals' }; }
  renderVals() {
    const tab = this.state.tab;
    const f = (n) => '$ ' + n.toLocaleString('es-CO');
    const tabs = [['goals', 'Ahorro'], ['recurring', 'Recurrentes']].map(([id, label]) => {
      const on = id === tab;
      return { label, on: on ? 'true' : 'false', bg: on ? '#FFFFFF' : 'transparent', fg: on ? '#16201B' : '#55615B', pick: () => this.setState({ tab: id }) };
    });
    const C = 2 * Math.PI * 15;
    const goals = [
      ['Viaje a Cartagena', '#0F5E55', 750000, 3000000, '375.000 al mes hasta jun 2027'],
      ['Fondo de emergencia', '#2563EB', 2400000, 6000000, 'Sin fecha límite'],
      ['Portátil nuevo', '#C2410C', 3100000, 3500000, 'Te faltan $ 400.000 · dic 2026']
    ].map(([name, color, saved, target, hint]) => {
      const p = saved / target;
      return { name, color, hint, pct: Math.round(p * 100) + '%', dash: (C * p).toFixed(1) + ' ' + C.toFixed(1), progress: f(saved) + ' de ' + f(target), aria: name + ': ' + Math.round(p * 100) + ' por ciento', addLabel: 'Aportar a ' + name };
    });
    const rules = [
      ['Arriendo', 'Mensual · día 5 · Bancolombia', 'expense', 1200000],
      ['Netflix', 'Mensual · día 20 · Tarjeta', 'expense', 39900],
      ['Spotify', 'Mensual · día 18 · Tarjeta', 'expense', 16900],
      ['Plan celular', 'Mensual · día 28 · Nequi', 'expense', 170000],
      ['Nómina', 'Mensual · día 15 · Bancolombia', 'income', 3500000]
    ].map(([name, meta, type, amt], i, arr) => ({
      name, meta,
      tint: type === 'income' ? '#E4ECFD' : '#FDECE2', ink: type === 'income' ? '#1D4ED8' : '#9A3412',
      color: type === 'income' ? '#1D4ED8' : '#B33A0A',
      amount: (type === 'income' ? '+ ' : '− ') + f(amt),
      sep: i === arr.length - 1 ? 'transparent' : '#EEF1EE'
    }));
    return { tabs, goals, rules, showGoals: tab === 'goals', showRecurring: tab === 'recurring' };
  }
}
</script>
</body>
</html>
