<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Bolsillo · Notificaciones</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0F5E55;text-decoration:none}a:hover{color:#0B4740}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F4F6F3; color: #16201B; font-family: Figtree, system-ui, sans-serif; display: flex; flex-direction: column">

  <div style="padding: 16px 20px 8px; display: flex; align-items: center; gap: 12px">
    <a href="InicioQuincena.dc.html" aria-label="Volver" style="width: 44px; height: 44px; border-radius: 14px; background: #FFFFFF; border: 1px solid #DDE3DE; color: #16201B; display: flex; align-items: center; justify-content: center">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></a>
    <h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 24px">Avisos</h1>
  </div>

  <div style="padding: 0 20px">
    <div role="tablist" aria-label="Sección" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; background: #E7EBE7; border-radius: 14px">
      <sc-for list="{{tabs}}" as="t" hint-placeholder-count="2">
        <button role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="height: 40px; border: 0; border-radius: 10px; background: {{t.bg}}; color: {{t.fg}}; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">{{t.label}}</button>
      </sc-for>
    </div>
  </div>

  <div style="flex: 1; overflow-y: auto; padding: 14px 20px 24px; display: flex; flex-direction: column; gap: 12px">
    <sc-if value="{{showInbox}}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <sc-for list="{{inbox}}" as="n" hint-placeholder-count="5">
          <div style="background: #FFFFFF; border-radius: 16px; padding: 12px 14px; display: flex; gap: 12px; align-items: flex-start; border: 1px solid {{n.border}}">
            <span style="width: 36px; height: 36px; border-radius: 10px; background: {{n.tint}}; color: {{n.ink}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-weight: 700; font-size: 14px">{{n.glyph}}</span>
            <div style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
              <div style="display: flex; justify-content: space-between; gap: 8px"><span style="font-weight: 700; font-size: 14px">{{n.title}}</span><span style="font-size: 11px; color: #55615B; white-space: nowrap">{{n.when}}</span></div>
              <span style="font-size: 13px; color: #3D4843; line-height: 1.4">{{n.body}}</span>
            </div>
            <sc-if value="{{n.unread}}" hint-placeholder-val="{{ false }}"><span aria-label="Sin leer" style="width: 8px; height: 8px; border-radius: 999px; background: #C2410C; margin-top: 6px"></span></sc-if>
          </div>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{showSettings}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; gap: 12px">
        <div style="background: #E3F0ED; border-radius: 16px; padding: 14px; display: flex; gap: 12px; align-items: center">
          <span style="width: 36px; height: 36px; border-radius: 10px; background: #0F5E55; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg></span>
          <div style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 700; font-size: 14px; color: #0B4740">Avisos activos en este celular</span><span style="font-size: 12px; color: #2F5E56">Llegan aunque la app esté cerrada</span></div>
        </div>

        <div style="background: #FFFFFF; border-radius: 18px; padding: 4px 16px">
          <sc-for list="{{prefs}}" as="p" hint-placeholder-count="4">
            <div style="display: flex; flex-direction: column; gap: 8px; padding: 12px 0; border-bottom: 1px solid {{p.sep}}">
              <button onClick="{{p.toggle}}" role="switch" aria-checked="{{p.on}}" style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0; border: 0; background: transparent; font: inherit; text-align: left; cursor: pointer; color: #16201B">
                <span style="flex: 1; display: flex; flex-direction: column"><span style="font-weight: 600; font-size: 14px">{{p.title}}</span><span style="font-size: 12px; color: #55615B">{{p.desc}}</span></span>
                <span style="width: 46px; height: 28px; border-radius: 999px; background: {{p.track}}; display: flex; align-items: center; padding: 3px; box-sizing: border-box; justify-content: {{p.justify}}"><span style="width: 22px; height: 22px; border-radius: 999px; background: #FFFFFF"></span></span>
              </button>
              <sc-if value="{{p.hasOption}}" hint-placeholder-val="{{ false }}">
                <div style="display: flex; gap: 8px">
                  <label style="flex: 1; display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: #55615B">{{p.optLabel}}
                    <select style="height: 40px; border-radius: 10px; border: 1px solid #DDE3DE; padding: 0 8px; font: inherit; font-size: 14px; color: #16201B; background: #FFFFFF"><option>{{p.optValue}}</option></select></label>
                  <sc-if value="{{p.hasTime}}" hint-placeholder-val="{{ false }}">
                    <label style="flex: 1; display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; color: #55615B">Hora
                      <input type="time" value="08:00" style="height: 40px; box-sizing: border-box; border-radius: 10px; border: 1px solid #DDE3DE; padding: 0 8px; font: inherit; font-size: 14px; color: #16201B"></label>
                  </sc-if>
                </div>
              </sc-if>
            </div>
          </sc-for>
        </div>

        <button style="height: 50px; border-radius: 14px; border: 1px solid #0F5E55; background: #FFFFFF; color: #0F5E55; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer">Enviar aviso de prueba</button>
        <span style="font-size: 12px; color: #55615B; line-height: 1.45; padding: 0 4px">Los avisos viajan cifrados por el servicio de notificaciones de Chrome; nadie más puede leer su contenido. Al tocarlos se abre Bolsillo (necesitas Tailscale activo).</span>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tab: 'inbox', budget: true, upcoming: true, pay: true, report: true }; }
  renderVals() {
    const s = this.state;
    const tabs = [['inbox', 'Recientes'], ['settings', 'Configurar']].map(([id, label]) => {
      const on = id === s.tab;
      return { label, on: on ? 'true' : 'false', bg: on ? '#FFFFFF' : 'transparent', fg: on ? '#16201B' : '#55615B', pick: () => this.setState({ tab: id }) };
    });
    const kinds = {
      budget: ['!', '#FFF0DC', '#9A3412'], upcoming: ['↻', '#FDECE2', '#9A3412'], pay: ['$', '#E4ECFD', '#1D4ED8'], report: ['▤', '#E3F0ED', '#0F5E55']
    };
    const inbox = [
      ['upcoming', 'Mañana: Plan celular', '$ 170.000 desde Nequi. Te quedan $ 737.600 esta quincena.', 'hace 2 h', true],
      ['budget', 'Comida llegó al 85 %', 'Te quedan $ 90.000 de tu presupuesto para 11 días.', 'ayer', true],
      ['pay', 'Llegó tu quincena', '+ $ 1.000.000 en Bancolombia. Puedes gastar ≈ $ 66.600 por día hasta el 29 oct.', '15 oct', false],
      ['budget', 'Entretenimiento excedido', 'Te pasaste por $ 20.000 este mes.', '12 oct', false],
      ['report', 'Tu reporte de septiembre está listo', 'Ahorraste $ 410.000 (20,5 %). Toca para verlo.', '1 oct', false]
    ].map(([k, title, body, when, unread]) => ({
      title, body, when, unread, glyph: kinds[k][0], tint: kinds[k][1], ink: kinds[k][2], border: unread ? '#F5D3AE' : 'transparent'
    }));
    const defs = [
      ['budget', 'Presupuestos', 'Cuando una categoría llega al umbral o se excede', 'Avisar al', '80 % del presupuesto', false],
      ['upcoming', 'Recurrentes próximos', 'Arriendo, servicios, suscripciones…', 'Avisar', '1 día antes', true],
      ['pay', 'Llegó la quincena', 'Con tu presupuesto diario sugerido', null, null, false],
      ['report', 'Reporte mensual', 'El día 1, cuando el mes anterior está listo', null, null, false]
    ];
    const prefs = defs.map(([key, title, desc, optLabel, optValue, hasTime], i) => {
      const on = s[key];
      return {
        title, desc, on: on ? 'true' : 'false', track: on ? '#0F5E55' : '#C9D1CC', justify: on ? 'flex-end' : 'flex-start',
        hasOption: on && !!optLabel, optLabel: optLabel || '', optValue: optValue || '', hasTime,
        sep: i === defs.length - 1 ? 'transparent' : '#EEF1EE',
        toggle: () => this.setState({ [key]: !on })
      };
    });
    return { tabs, inbox, prefs, showInbox: s.tab === 'inbox', showSettings: s.tab === 'settings' };
  }
}
</script>
</body>
</html>
